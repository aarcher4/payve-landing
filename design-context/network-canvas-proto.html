<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NetworkCanvas proto — Payve corridor visualization</title>
<style>
  /* Industrial Confidence tokens (mirror of design-context/colors_and_type.css) */
  :root {
    --paper: #F7F8F9; --paper-2: #EEF0F2; --paper-elev: #FFFFFF;
    --ink-1: #0B0D12; --ink-2: #4A4F58; --ink-3: #767C86;
    --hairline: #E1E4E8; --hairline-2: #CFD3D9;
    --sage-200: #C5D5CC; --sage-300: #A8C0B3; --sage-500: #6F8D7C;
    --sage-600: #506B60; --sage-700: #3B5448;
  }
  body { margin: 0; background: var(--paper); font-family: system-ui, sans-serif; }
  .wrap { max-width: 1104px; margin: 40px auto; padding: 0 16px; }
  .eyebrow { font: 600 11px/1.2 monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
  .scene { position: relative; height: 400px; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .chip { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px;
    background: var(--paper-elev); border: 1px solid var(--hairline-2); border-radius: 4px;
    padding: 5px 9px; font: 600 10.5px/1 ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-1); white-space: nowrap; box-shadow: 0 1px 2px rgba(11,13,18,0.06); }
  .chip .ccy { color: var(--ink-3); font-weight: 500; }
  .chip .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--sage-500); transition: box-shadow .3s, background .3s; }
  .chip.hit .dot { background: var(--sage-600); box-shadow: 0 0 0 3px rgba(111,141,124,0.25); }
  @media (max-width: 640px) { .scene { height: 300px; } .chip { padding: 4px 7px; font-size: 9px; } .chip .region-full { display: none; } }
  @media (min-width: 641px) { .chip .region-short { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Five corridors, one network</div>
  <div class="scene" id="scene">
    <canvas id="net" aria-hidden="true"></canvas>
  </div>
</div>
<script>
(() => {
  const NODES = [
    { id: "us", full: "United States", short: "US", ccy: "USD", x: 0.26, y: 0.30 },
    { id: "eu", full: "European Union", short: "EU", ccy: "EUR", x: 0.84, y: 0.22 },
    { id: "mx", full: "Mexico", short: "MX", ccy: "MXN", x: 0.13, y: 0.66 },
    { id: "co", full: "Colombia", short: "CO", ccy: "COP", x: 0.46, y: 0.80 },
    { id: "br", full: "Brazil", short: "BR", ccy: "BRL", x: 0.72, y: 0.66 },
  ];
  const ARCS = [
    { a: "us", b: "mx", dur: 6.0, phase: 0.00 },
    { a: "us", b: "co", dur: 7.2, phase: 0.35 },
    { a: "us", b: "br", dur: 8.0, phase: 0.62 },
    { a: "us", b: "eu", dur: 6.8, phase: 0.18 },
    { a: "mx", b: "eu", dur: 9.0, phase: 0.80 },
  ];
  const scene = document.getElementById("scene");
  const canvas = document.getElementById("net");
  const ctx = canvas.getContext("2d");
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // DOM chips
  const chipEls = {};
  for (const n of NODES) {
    const el = document.createElement("div");
    el.className = "chip";
    el.style.left = (n.x * 100) + "%";
    el.style.top = (n.y * 100) + "%";
    el.innerHTML = `<span class="dot"></span><span class="region-full">${n.full}</span><span class="region-short">${n.short}</span><span class="ccy">${n.ccy}</span>`;
    scene.appendChild(el);
    chipEls[n.id] = el;
  }

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = scene.clientWidth; H = scene.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  new ResizeObserver(resize).observe(scene);

  const px = n => ({ x: n.x * W, y: n.y * H });
  // Quadratic arc: control point lifted perpendicular-ish (upward bias)
  function ctrl(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    return { x: mx, y: my - Math.min(d * 0.30, H * 0.34) };
  }
  const qPoint = (a, c, b, t) => ({
    x: (1 - t) ** 2 * a.x + 2 * (1 - t) * t * c.x + t * t * b.x,
    y: (1 - t) ** 2 * a.y + 2 * (1 - t) * t * c.y + t * t * b.y,
  });

  // Ambient particle field
  const P = Array.from({ length: 90 }, () => ({
    x: Math.random(), y: Math.random(),
    r: 0.6 + Math.random() * 0.9,
    a: 0.06 + Math.random() * 0.16,
    sp: 0.2 + Math.random() * 0.6, ph: Math.random() * Math.PI * 2,
  }));

  const hits = {}; // chip flash timers
  function draw(tSec) {
    ctx.clearRect(0, 0, W, H);

    // particles (twinkle + slow drift)
    ctx.fillStyle = "#A8C0B3";
    for (const p of P) {
      const tw = 0.5 + 0.5 * Math.sin(tSec * p.sp + p.ph);
      ctx.globalAlpha = p.a * tw;
      const dx = Math.sin(tSec * 0.05 + p.ph) * 6;
      ctx.beginPath();
      ctx.arc(p.x * W + dx, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // dotted arcs
    for (const arc of ARCS) {
      const a = px(byId[arc.a]), b = px(byId[arc.b]), c = ctrl(a, b);
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      const steps = Math.max(24, Math.floor(d / 9));
      ctx.fillStyle = "#A8C0B3";
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const p = qPoint(a, c, b, t);
        ctx.globalAlpha = 0.34 + 0.26 * Math.sin(t * Math.PI);
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.15, 0, Math.PI * 2); ctx.fill();
      }
    }

    // pulses with trails
    if (!reduced) {
      for (const arc of ARCS) {
        const a = px(byId[arc.a]), b = px(byId[arc.b]), c = ctrl(a, b);
        const cycle = ((tSec / arc.dur) + arc.phase) % 1;
        // forward then reverse alternate: use cycle<0.5 → a→b, else b→a
        const fwd = (Math.floor((tSec / arc.dur) + arc.phase) % 2) === 0;
        const t = fwd ? cycle : 1 - cycle;
        for (let k = 5; k >= 0; k--) {
          const tt = Math.max(0, Math.min(1, t - k * 0.012 * (fwd ? 1 : -1)));
          const p = qPoint(a, c, b, tt);
          ctx.globalAlpha = k === 0 ? 0.95 : 0.36 - k * 0.05;
          ctx.fillStyle = "#6F8D7C";
          ctx.beginPath(); ctx.arc(p.x, p.y, k === 0 ? 2.7 : 1.7, 0, Math.PI * 2); ctx.fill();
        }
        // arrival flash on chip
        const dest = fwd ? arc.b : arc.a;
        if (cycle > 0.96 && !hits[dest]) {
          hits[dest] = true;
          chipEls[dest].classList.add("hit");
          setTimeout(() => { chipEls[dest].classList.remove("hit"); hits[dest] = false; }, 600);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  let raf = null, visible = true;
  const t0 = performance.now();
  function loop(now) {
    draw((now - t0) / 1000);
    if (visible && !reduced) raf = requestAnimationFrame(loop);
  }
  new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && !reduced && raf === null) raf = requestAnimationFrame(loop);
    if (!visible && raf !== null) { cancelAnimationFrame(raf); raf = null; }
  }).observe(scene);
  if (reduced) draw(3.7); else raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
